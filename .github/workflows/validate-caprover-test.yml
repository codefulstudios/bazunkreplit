name: Validate Bazunk CapRover test images

on:
  workflow_dispatch:
  push:
    branches: [caprover-test]
    paths:
      - 'deploy/caprover/**'
      - 'captain-definition'
      - '.github/workflows/validate-caprover-test.yml'
      - 'artifacts/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [web, api]
    steps:
      - uses: actions/checkout@v4
      - name: Build test image without deploying
        run: docker build --file deploy/caprover/Dockerfile.${{ matrix.component }} --tag bazunk-${{ matrix.component }}:test .
