name: Demo Creator validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'artifacts/api-server/**'
      - 'artifacts/sellbuydeal/**'
      - 'lib/db/**'
      - '.github/workflows/demo-creator-validation.yml'
jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false
      - name: Typecheck libraries
        run: pnpm run typecheck:libs
      - name: Typecheck API
        run: pnpm --filter @workspace/api-server run typecheck
      - name: Typecheck frontend
        run: pnpm --filter @workspace/sellbuydeal run typecheck
      - name: Build API
        run: pnpm --filter @workspace/api-server run build
      - name: Build frontend
        run: pnpm --filter @workspace/sellbuydeal run build
