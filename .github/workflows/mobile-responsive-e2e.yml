name: Mobile responsive E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/sellbuydeal/src/**'
      - 'tests/mobile/**'
      - '.github/workflows/mobile-responsive-e2e.yml'
  schedule:
    - cron: '30 6 * * 1'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright runner
        run: npm install --prefix tests/mobile --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: tests/mobile/node_modules/.bin/playwright install --with-deps chromium
      - name: Run responsive smoke tests
        env:
          BASE_URL: https://www.bazunk.com
          MOBILE_AUTH_STORAGE_STATE: ${{ secrets.MOBILE_AUTH_STORAGE_STATE }}
        run: node tests/mobile/smoke.mjs
      - name: Upload failure screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-results
          path: mobile-results/
          if-no-files-found: ignore
