name: Build Bazunk test APK
on:
  workflow_dispatch:
  # One-off automatic run for the recovery branch. Normal APK builds remain manual.
  push:
    branches:
      - android/recovered-test-build
    paths:
      - .github/workflows/bazunk-android-preview.yml
permissions:
  contents: read
concurrency:
  group: bazunk-android-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/bazunk-android
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://bazunk-api.onrender.com/api' }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/bazunk-android/package-lock.json
      - name: Check Expo account setup
        run: node scripts/check-build-setup.cjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test tests/import-validation.test.mjs
      - name: Build a signed installable APK on Expo
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait
