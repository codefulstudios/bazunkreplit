name: Repair staging pnpm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - feature/admin-demo-creator
    paths:
      - .github/workflows/repair-staging-lockfile.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-demo-creator
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile change
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh pnpm lockfile for staging builds"
          git push origin HEAD:feature/admin-demo-creator
