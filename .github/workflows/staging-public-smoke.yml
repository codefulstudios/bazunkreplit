name: Staging public smoke checks
on:
  push:
    branches:
      - feature/admin-demo-creator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check API liveness and public settings
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl --silent --show-error --location --max-time 20 --output /tmp/bazunk-health.json --write-out '%{http_code}' https://bazunk-api-staging.onrender.com/health || true)
            if [[ "$code" == "200" ]] && grep -q '"status":"ok"' /tmp/bazunk-health.json; then
              echo "Staging API healthy"
              break
            fi
            if [[ "$attempt" == "24" ]]; then echo "Staging API health unavailable (HTTP $code)"; exit 1; fi
            sleep 10
          done
          curl --fail --silent --show-error --location --max-time 30 https://bazunk-api-staging.onrender.com/api/settings/public -o /tmp/bazunk-settings.json
          python3 -m json.tool /tmp/bazunk-settings.json > /dev/null
      - name: Check staging site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl --silent --show-error --location --max-time 20 --output /tmp/bazunk-home.html --write-out '%{http_code}' https://bazunk-web-staging.onrender.com/ || true)
            if [[ "$code" == "200" ]] && grep -qi '<html' /tmp/bazunk-home.html; then
              echo "Staging website reachable"
              exit 0
            fi
            if [[ "$attempt" == "24" ]]; then echo "Staging website unavailable (HTTP $code)"; exit 1; fi
            sleep 10
          done
