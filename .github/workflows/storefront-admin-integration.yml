name: Storefront and admin integration contracts
on:
  pull_request:
    paths:
      - 'artifacts/sellbuydeal/src/components/Footer.tsx'
      - 'artifacts/sellbuydeal/src/pages/DashboardPage.tsx'
      - 'artifacts/sellbuydeal/src/pages/admin/AdminDesignSystemPage.tsx'
      - 'artifacts/sellbuydeal/src/pages/admin/AdminSettingsPage.tsx'
      - 'artifacts/sellbuydeal/src/App.tsx'
      - 'scripts/storefront-admin-integration-contract.test.mjs'
      - '.github/workflows/storefront-admin-integration.yml'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/storefront-admin-integration-contract.test.mjs
