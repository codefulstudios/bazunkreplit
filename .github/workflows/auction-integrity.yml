name: Auction integrity regression tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'artifacts/api-server/src/routes/auctions.ts'
      - 'artifacts/api-server/src/lib/auctionRules*'
      - 'artifacts/api-server/src/lib/auctionFulfillment.ts'
      - 'artifacts/api-server/src/routes/stripe.ts'
      - 'artifacts/api-server/src/webhookHandlers.ts'
      - 'artifacts/sellbuydeal/src/pages/AuctionDetailPage.tsx'
      - 'artifacts/sellbuydeal/src/pages/DashboardPage.tsx'
      - '.github/workflows/auction-integrity.yml'
jobs:
  auction-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --prod=false
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server run typecheck
      - run: pnpm --filter @workspace/sellbuydeal run typecheck
      - name: Run auction rule regression tests
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/auctionRules.test.ts --bundle --platform=node --format=esm --outfile=/tmp/bazunk-auction-rules.test.mjs
          node --test /tmp/bazunk-auction-rules.test.mjs
